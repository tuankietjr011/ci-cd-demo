<!DOCTYPE html>
<html lang="vi">

<head>
<base href="/">
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ưu đãi thành viên | ShopLux</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="/offers/offers.css">
  <link rel="stylesheet" href="/css/shoplux-care.css">
</head>

<body>

<header
  class="border-b"
  style="
    background:#3b2416;
    border-color:#c9a227;
  "
>

  <div
    class="
      max-w-7xl
      mx-auto
      px-4
      py-6
      flex
      items-center
      justify-between
    "
  >

    <a
      href="/"
      class="text-center"
    >

      <div
        class="
          luxury-font
          text-3xl
          font-bold
          tracking-[5px]
        "
        style="color:#e8d5a3"
      >
        SHOPLUX
      </div>

      <div
        class="
          text-[9px]
          tracking-[4px]
          mt-1
        "
        style="color:#fffdf8"
      >
        MAISON • LUXURY FASHION
      </div>

    </a>


  <a
  href="/"
  class="flex items-center gap-2 text-sm font-bold tracking-[1px] whitespace-nowrap"
  style="color:#e8d5a3"
>
  <span aria-hidden="true">←</span>
  TRANG CHỦ
</a>

  </div>

</header>


<main
  class="
    max-w-7xl
    mx-auto
    px-4
    py-14
  "
>

  <div class="text-center">

    <div
      class="
        text-[10px]
        tracking-[6px]
      "
      style="color:#70452d"
    >
      SHOPLUX MEMBER
    </div>

    <h1
      class="
        luxury-font
        text-4xl
        md:text-5xl
        mt-3
      "
    >
      ƯU ĐÃI THÀNH VIÊN
    </h1>

    <p
      class="
        text-sm
        text-gray-500
        mt-3
        leading-6
      "
    >
      Đặc quyền mua sắm dành cho thành viên ShopLux.
      Sao chép mã và sử dụng tại trang thanh toán.
    </p>

  </div>


  <!-- COUPONS -->
  <div
    id="couponList"
    class="
      grid
      md:grid-cols-2
      lg:grid-cols-3
      gap-6
      mt-12
    "
  >

    <div
      class="
        col-span-full
        text-center
        py-16
        text-gray-500
      "
    >
      Đang tải ưu đãi...
    </div>

  </div>


  <div class="text-center mt-12">

    <a
      href="/"
      class="
        inline-block
        px-10
        py-4
        font-bold
        tracking-[2px]
        transition
        hover:opacity-90
      "
      style="
        background:#3b2416;
        color:#e8d5a3;
      "
    >
      MUA SẮM NGAY
    </a>

  </div>

</main>


<script src="/offers/offers.js"></script>

  <script src="/js/shoplux-care.js"></script>
</body>
</html>
