<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ShopLux Fashion Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<header class="bg-[#c9001e] text-white p-4">
  <div class="max-w-7xl mx-auto flex justify-between items-center">
    <div>
      <h1 class="text-xl font-black">SHOPLUX FASHION</h1>
      <p class="text-xs opacity-80">ADMIN CENTER</p>
    </div>

    <a href="/" class="border border-white px-4 py-2 rounded">
      Trang khách
    </a>
  </div>
</header>

<main class="max-w-7xl mx-auto p-5">

  <div class="grid lg:grid-cols-5 gap-5">

    <section class="lg:col-span-2 bg-white rounded-xl shadow-sm p-5">

      <h2 id="formTitle" class="font-black text-xl mb-5">
        THÊM SẢN PHẨM
      </h2>

      <input type="hidden" id="editId">

      <label class="font-bold">Tên sản phẩm</label>
      <input id="name" class="border rounded p-3 w-full mt-1 mb-4">

      <label class="font-bold">Thương hiệu</label>
      <input
        id="brand"
        placeholder="Nike, adidas, Puma..."
        class="border rounded p-3 w-full mt-1 mb-4"
      >

      <div class="grid grid-cols-2 gap-3">

        <div>
          <label class="font-bold">Giá bán</label>
          <input
            id="price"
            type="number"
            class="border rounded p-3 w-full mt-1 mb-4"
          >
        </div>

        <div>
          <label class="font-bold">Giá gốc</label>
          <input
            id="originalPrice"
            type="number"
            class="border rounded p-3 w-full mt-1 mb-4"
          >
        </div>

      </div>

      <label class="font-bold">Danh mục</label>

      <select
        id="category"
        onchange="renderSubcategories()"
        class="border rounded p-3 w-full mt-1 mb-4"
      >
        <option value="1">Nam</option>
        <option value="2">Nữ</option>
        <option value="3">Giày Dép</option>
        <option value="4">Phụ Kiện</option>
        <option value="5">Đồ Bóng Đá</option>
      </select>

      <label class="font-bold">Danh mục con</label>

      <select
        id="subcategory"
        class="border rounded p-3 w-full mt-1 mb-4"
      ></select>

      <label class="font-bold">Size</label>

      <div id="sizes" class="flex flex-wrap gap-2 my-3">
        <label><input type="checkbox" value="S"> S</label>
        <label><input type="checkbox" value="M"> M</label>
        <label><input type="checkbox" value="L"> L</label>
        <label><input type="checkbox" value="XL"> XL</label>
        <label><input type="checkbox" value="XXL"> XXL</label>
        <label><input type="checkbox" value="39"> 39</label>
        <label><input type="checkbox" value="40"> 40</label>
        <label><input type="checkbox" value="41"> 41</label>
        <label><input type="checkbox" value="42"> 42</label>
        <label><input type="checkbox" value="43"> 43</label>
      </div>

      <label class="font-bold">Ảnh sản phẩm (tối đa 4)</label>

      <input
        id="images"
        type="file"
        multiple
        accept="image/*"
        onchange="readImages()"
        class="border rounded p-3 w-full mt-1"
      >

      <div id="preview" class="grid grid-cols-4 gap-2 my-4"></div>

      <label class="font-bold">Mô tả</label>

      <textarea
        id="desc"
        rows="4"
        class="border rounded p-3 w-full mt-1 mb-4"
      ></textarea>

      <div class="flex gap-2">

        <button
          onclick="saveProduct()"
          id="saveButton"
          class="flex-1 bg-[#c9001e] text-white rounded p-3 font-black"
        >
          ĐĂNG SẢN PHẨM
        </button>

        <button
          onclick="resetForm()"
          id="cancelButton"
          class="hidden bg-gray-500 text-white rounded px-5"
        >
          Hủy
        </button>

      </div>

    </section>

    <section class="lg:col-span-3 bg-white rounded-xl shadow-sm p-5">

      <h2 class="font-black text-xl mb-5">
        SẢN PHẨM ĐANG BÁN
      </h2>

      <div id="productList" class="space-y-3"></div>

    </section>

  </div>

</main>

<script>
const API = "/api";

let products = [];
let currentImages = [];

const subs = {
  1: [
    ["ao-thun-nam","Áo thun"],
    ["ao-polo-nam","Áo polo"],
    ["ao-so-mi-nam","Áo sơ mi"],
    ["ao-khoac-nam","Áo khoác"],
    ["quan-jeans-nam","Quần jeans"],
    ["quan-short-nam","Quần short"]
  ],
  2: [
    ["ao-nu","Áo nữ"],
    ["vay-dam","Váy / Đầm"],
    ["quan-nu","Quần nữ"],
    ["ao-khoac-nu","Áo khoác nữ"]
  ],
  3: [
    ["sneaker","Sneaker"],
    ["giay-the-thao","Giày thể thao"],
    ["dep","Dép"]
  ],
  4: [
    ["tui-balo","Túi / Balo"],
    ["mu","Mũ"],
    ["kinh","Kính"],
    ["that-lung","Thắt lưng"],
    ["vi","Ví"]
  ],
  5: [
    ["ao-clb","Áo CLB"],
    ["ao-doi-tuyen","Áo đội tuyển"],
    ["quan-bong-da","Quần bóng đá"],
    ["giay-bong-da","Giày bóng đá"],
    ["phu-kien-bong-da","Phụ kiện bóng đá"]
  ]
};

function renderSubcategories(selected = "") {
  const id = Number(category.value);

  subcategory.innerHTML = (subs[id] || [])
    .map(([value,name]) =>
      `<option value="${value}" ${value === selected ? "selected" : ""}>${name}</option>`
    )
    .join("");
}

function fileBase64(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

async function readImages() {
  const files = [...images.files].slice(0,4);

  currentImages = await Promise.all(
    files.map(fileBase64)
  );

  renderPreview();
}

function renderPreview() {
  preview.innerHTML = currentImages.map((src,i) => `
    <div class="relative">
      <img src="${src}" class="w-full aspect-square object-cover rounded">
      <button
        onclick="removeImage(${i})"
        class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-6 h-6"
      >×</button>
    </div>
  `).join("");
}

function removeImage(i) {
  currentImages.splice(i,1);
  renderPreview();
}

function selectedSizes() {
  return [
    ...document.querySelectorAll("#sizes input:checked")
  ].map(el => el.value);
}

async function loadProducts() {
  const response = await fetch(API + "/products");
  const json = await response.json();

  products = json.data || [];

  productList.innerHTML = products.map(p => `
    <div class="border rounded-lg p-3 flex items-center gap-3">

      <img
        src="${p.image || (p.images || [])[0] || "https://placehold.co/100"}"
        class="w-16 h-16 rounded object-cover"
      >

      <div class="flex-1">
        <div class="font-black">${p.name}</div>
        <div class="text-xs text-gray-500">${p.brand || "ShopLux"}</div>
        <div class="text-[#c9001e] font-bold">
          ${Number(p.price || 0).toLocaleString("vi-VN")} ₫
        </div>
      </div>

      <button
        onclick="editProduct(${p.id})"
        class="bg-gray-900 text-white px-3 py-2 rounded"
      >
        Sửa
      </button>

      <button
        onclick="deleteProduct(${p.id})"
        class="bg-[#c9001e] text-white px-3 py-2 rounded"
      >
        Xóa
      </button>

    </div>
  `).join("");
}

async function saveProduct() {
  const id = editId.value;

  const payload = {
    name: name.value.trim(),
    brand: brand.value.trim(),
    price: Number(price.value),
    originalPrice: Number(originalPrice.value),
    categoryId: Number(category.value),
    subcategoryId: subcategory.value,
    sizes: selectedSizes(),
    images: currentImages,
    desc: desc.value.trim()
  };

  if (!payload.name || !payload.price) {
    alert("Nhập tên và giá sản phẩm");
    return;
  }

  const response = await fetch(
    id ? `${API}/admin/products/${id}` : `${API}/admin/products`,
    {
      method: id ? "PUT" : "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    }
  );

  const json = await response.json();

  if (!json.success) {
    alert(json.message || "Có lỗi xảy ra");
    return;
  }

  resetForm();
  loadProducts();
}

function editProduct(id) {
  const p = products.find(x => Number(x.id) === Number(id));
  if (!p) return;

  editId.value = p.id;
  name.value = p.name || "";
  brand.value = p.brand || "";
  price.value = p.price || "";
  originalPrice.value = p.originalPrice || "";
  category.value = p.categoryId || 1;

  renderSubcategories(p.subcategoryId);

  desc.value = p.desc || "";
  currentImages = (p.images || (p.image ? [p.image] : [])).slice(0,4);

  document.querySelectorAll("#sizes input").forEach(input => {
    input.checked = (p.sizes || []).includes(input.value);
  });

  renderPreview();

  formTitle.textContent = "SỬA SẢN PHẨM";
  saveButton.textContent = "LƯU THAY ĐỔI";
  cancelButton.classList.remove("hidden");

  window.scrollTo({top:0,behavior:"smooth"});
}

function resetForm() {
  editId.value = "";
  name.value = "";
  brand.value = "";
  price.value = "";
  originalPrice.value = "";
  desc.value = "";
  images.value = "";
  category.value = 1;

  currentImages = [];

  document.querySelectorAll("#sizes input").forEach(x => {
    x.checked = false;
  });

  renderSubcategories();
  renderPreview();

  formTitle.textContent = "THÊM SẢN PHẨM";
  saveButton.textContent = "ĐĂNG SẢN PHẨM";
  cancelButton.classList.add("hidden");
}

async function deleteProduct(id) {
  if (!confirm("Xóa sản phẩm này?")) return;

  await fetch(`${API}/admin/products/${id}`, {
    method:"DELETE"
  });

  loadProducts();
}

renderSubcategories();
loadProducts();
</script>

</body>
</html>
