<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore - Frontend & Backend Decoupled</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
  <header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">⚡</span>
        <h1 class="text-xl font-bold text-indigo-600">DevOps TechStore</h1>
      </div>
      <div class="flex items-center space-x-3">
        <div id="auth-section" class="flex items-center space-x-2"></div>
        <button onclick="openModal('cart-modal')" class="relative bg-indigo-600 text-white px-3.5 py-1.5 rounded-lg hover:bg-indigo-700 transition flex items-center space-x-1.5 text-sm">
          <span>🛒 Giỏ hàng</span>
          <span id="cart-count" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-10">
    <h3 class="text-2xl font-bold mb-6 text-gray-900 border-l-4 border-indigo-600 pl-3">Sản phẩm từ REST API</h3>
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
  </main>

  <!-- Modal Đăng Ký -->
  <div id="register-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-sm w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-3">
        <h4 class="text-lg font-bold">Tạo tài khoản</h4>
        <button onclick="closeModal('register-modal')" class="text-2xl text-gray-400">&times;</button>
      </div>
      <div class="mt-4 space-y-3">
        <input id="reg-fullname" type="text" placeholder="Họ và tên" class="w-full border px-3 py-2 rounded-lg text-sm">
        <input id="reg-username" type="text" placeholder="Tên đăng nhập" class="w-full border px-3 py-2 rounded-lg text-sm">
        <input id="reg-password" type="password" placeholder="Mật khẩu" class="w-full border px-3 py-2 rounded-lg text-sm">
        <button onclick="handleRegister()" class="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700">Xác nhận</button>
      </div>
    </div>
  </div>

  <!-- Modal Đăng Nhập -->
  <div id="login-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-sm w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-3">
        <h4 class="text-lg font-bold">Đăng nhập</h4>
        <button onclick="closeModal('login-modal')" class="text-2xl text-gray-400">&times;</button>
      </div>
      <div class="mt-4 space-y-3">
        <input id="login-username" type="text" placeholder="Tên đăng nhập" class="w-full border px-3 py-2 rounded-lg text-sm">
        <input id="login-password" type="password" placeholder="Mật khẩu" class="w-full border px-3 py-2 rounded-lg text-sm">
        <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700">Đăng nhập</button>
      </div>
    </div>
  </div>

  <!-- Modal Giỏ hàng -->
  <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-3">
        <h4 class="text-xl font-bold">Giỏ hàng</h4>
        <button onclick="closeModal('cart-modal')" class="text-2xl text-gray-400">&times;</button>
      </div>
      <div id="cart-items" class="divide-y max-h-60 overflow-y-auto my-4"></div>
      <div class="border-t pt-3 flex justify-between font-bold">
        <span>Tổng thanh toán:</span>
        <span id="cart-total" class="text-indigo-600">0 đ</span>
      </div>
      <button onclick="checkout()" class="w-full mt-4 bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700">Đặt hàng</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
