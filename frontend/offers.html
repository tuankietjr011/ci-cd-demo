<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ưu đãi thành viên | ShopLux</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    :root {
      --brown: #3b2416;
      --brown-dark: #1f120c;
      --gold: #c9a227;
      --champagne: #e8d5a3;
      --ivory: #f7f1e7;
    }

    body {
      margin: 0;
      background: var(--ivory);
      color: var(--brown-dark);
      font-family: Arial, sans-serif;
    }

    .luxury-font {
      font-family: Georgia, "Times New Roman", serif;
    }

    .coupon-card {
      transition: .25s;
    }

    .coupon-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(31, 18, 12, .12);
    }
  </style>
</head>

<body>

<header
  class="border-b"
  style="
    background:#3b2416;
    border-color:#c9a227;
  "
>

  <div
    class="
      max-w-7xl
      mx-auto
      px-4
      py-6
      flex
      items-center
      justify-between
    "
  >

    <a
      href="/"
      class="text-center"
    >

      <div
        class="
          luxury-font
          text-3xl
          font-bold
          tracking-[5px]
        "
        style="color:#e8d5a3"
      >
        SHOPLUX
      </div>

      <div
        class="
          text-[9px]
          tracking-[4px]
          mt-1
        "
        style="color:#fffdf8"
      >
        MAISON • LUXURY FASHION
      </div>

    </a>


    <a
      href="/"
      class="
        text-sm
        font-bold
        tracking-[1px]
        hover:underline
      "
      style="color:#e8d5a3"
    >
      <i class="fa-solid fa-arrow-left mr-2"></i>
      TRANG CHỦ
    </a>

  </div>

</header>


<main
  class="
    max-w-7xl
    mx-auto
    px-4
    py-14
  "
>

  <div class="text-center">

    <div
      class="
        text-[10px]
        tracking-[6px]
      "
      style="color:#70452d"
    >
      SHOPLUX MEMBER
    </div>

    <h1
      class="
        luxury-font
        text-4xl
        md:text-5xl
        mt-3
      "
    >
      ƯU ĐÃI THÀNH VIÊN
    </h1>

    <p
      class="
        text-sm
        text-gray-500
        mt-3
        leading-6
      "
    >
      Đặc quyền mua sắm dành cho thành viên ShopLux.
      Sao chép mã và sử dụng tại trang thanh toán.
    </p>

  </div>


  <!-- COUPONS -->
  <div
    id="couponList"
    class="
      grid
      md:grid-cols-2
      lg:grid-cols-3
      gap-6
      mt-12
    "
  >

    <div
      class="
        col-span-full
        text-center
        py-16
        text-gray-500
      "
    >
      Đang tải ưu đãi...
    </div>

  </div>


  <div class="text-center mt-12">

    <a
      href="/"
      class="
        inline-block
        px-10
        py-4
        font-bold
        tracking-[2px]
        transition
        hover:opacity-90
      "
      style="
        background:#3b2416;
        color:#e8d5a3;
      "
    >
      MUA SẮM NGAY
    </a>

  </div>

</main>


<script>

const API = "/api";


function formatMoney(value) {
  return Number(value || 0)
    .toLocaleString("vi-VN") + "đ";
}


function getCouponIcon(type) {

  if (type === "percent") {
    return "fa-percent";
  }

  if (type === "fixed") {
    return "fa-gift";
  }

  if (type === "shipping") {
    return "fa-truck-fast";
  }

  return "fa-ticket";
}


function getCouponTitle(coupon) {

  if (coupon.type === "percent") {

    return `GIẢM ${Number(coupon.value)}%`;

  }

  if (coupon.type === "fixed") {

    return `GIẢM ${formatMoney(coupon.value)}`;

  }

  if (coupon.type === "shipping") {

    return "FREESHIP";

  }

  return "ƯU ĐÃI";

}


function getCouponDescription(coupon) {

  let text = "";


  if (coupon.type === "percent") {

    text =
      `Giảm ${Number(coupon.value)}%`;

  }


  if (coupon.type === "fixed") {

    text =
      `Giảm trực tiếp ${formatMoney(coupon.value)}`;

  }


  if (coupon.type === "shipping") {

    text =
      "Miễn phí vận chuyển";

  }


  if (Number(coupon.min_order || 0) > 0) {

    text +=
      ` cho đơn hàng từ ${formatMoney(coupon.min_order)}`;

  }


  text += ".";


  if (
    coupon.type === "percent" &&
    coupon.max_discount !== null &&
    Number(coupon.max_discount) > 0
  ) {

    text +=
      ` Giảm tối đa ${formatMoney(coupon.max_discount)}.`;

  }


  return text;

}


function getCouponRemaining(coupon) {

  if (coupon.usage_limit === null) {
    return "";
  }


  const limit =
    Number(coupon.usage_limit);

  const used =
    Number(coupon.used_count || 0);

  const remaining =
    Math.max(
      limit - used,
      0
    );


  return `
    <div
      class="
        text-xs
        text-gray-400
        mt-4
      "
    >
      Còn ${remaining} lượt sử dụng
    </div>
  `;

}


function getCouponExpire(coupon) {

  if (!coupon.end_at) {
    return "";
  }


  const date =
    new Date(coupon.end_at);


  return `
    <div
      class="
        text-xs
        text-gray-400
        mt-1
      "
    >
      Hết hạn:
      ${date.toLocaleString("vi-VN")}
    </div>
  `;

}


function renderCoupons(coupons) {

  const container =
    document.getElementById("couponList");


  if (!coupons.length) {

    container.innerHTML = `
      <div
        class="
          col-span-full
          text-center
          py-16
          text-gray-500
        "
      >
        Hiện chưa có ưu đãi nào.
      </div>
    `;

    return;

  }


  container.innerHTML =
    coupons.map(coupon => `

      <div
        class="
          coupon-card
          bg-[#fffdf8]
          border
          p-7
          flex
          flex-col
        "
        style="border-color:#e8d5a3"
      >

        <div
          class="
            w-12
            h-12
            flex
            items-center
            justify-center
            text-xl
          "
          style="
            background:#3b2416;
            color:#e8d5a3;
          "
        >
          <i
            class="
              fa-solid
              ${getCouponIcon(coupon.type)}
            "
          ></i>
        </div>


        <div
          class="
            text-xs
            tracking-[3px]
            mt-6
          "
          style="color:#70452d"
        >
          MEMBER OFFER
        </div>


        <h2
          class="
            luxury-font
            text-3xl
            mt-2
          "
        >
          ${getCouponTitle(coupon)}
        </h2>


        <p
          class="
            text-sm
            text-gray-500
            mt-3
            leading-6
            min-h-[48px]
          "
        >
          ${getCouponDescription(coupon)}
        </p>


        ${getCouponRemaining(coupon)}

        ${getCouponExpire(coupon)}


        <div class="flex-1"></div>


        <div
          class="
            mt-7
            border
            border-dashed
            p-4
            flex
            justify-between
            items-center
            gap-3
          "
          style="border-color:#c9a227"
        >

          <b
            class="
              tracking-[2px]
              text-lg
              break-all
            "
          >
            ${coupon.code}
          </b>


          <button
            onclick="
              copyCoupon(
                '${coupon.code}',
                this
              )
            "
            class="
              text-xs
              font-bold
              hover:underline
              whitespace-nowrap
            "
            style="color:#70452d"
          >
            SAO CHÉP
          </button>

        </div>

      </div>

    `).join("");

}


async function loadCoupons() {

  const container =
    document.getElementById("couponList");


  try {

    const response =
      await fetch(
        API + "/coupons"
      );


    const json =
      await response.json();


    if (
      !response.ok ||
      !json.success
    ) {

      throw new Error(
        json.message ||
        "Không thể tải ưu đãi."
      );

    }


    const coupons =
      json.coupons ||
      json.data ||
      [];


    renderCoupons(coupons);


  } catch (error) {

    console.error(
      "LOAD COUPONS ERROR:",
      error
    );


    container.innerHTML = `
      <div
        class="
          col-span-full
          text-center
          py-16
          text-red-600
        "
      >
        Không thể tải ưu đãi.
      </div>
    `;

  }

}


function copyCoupon(code, button) {

  navigator.clipboard
    .writeText(code)
    .then(() => {

      const oldText =
        button.textContent;

      button.textContent =
        "ĐÃ SAO CHÉP";


      setTimeout(() => {

        button.textContent =
          oldText;

      }, 1500);

    })
    .catch(() => {

      alert(
        "Mã ưu đãi: " + code
      );

    });

}


loadCoupons();

</script>

</body>
</html>
